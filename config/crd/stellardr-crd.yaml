apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stellarfailovers.stellar.org
spec:
  group: stellar.org
  names:
    categories: []
    kind: StellarFailover
    plural: stellarfailovers
    shortNames:
    - sf
    singular: stellarfailover
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.primaryCluster
      name: PrimaryCluster
      type: string
    - jsonPath: .status.activeRegion
      name: ActiveRegion
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: StellarFailover defines multi-cluster active-passive failover
        type: object
        properties:
          spec:
            type: object
            required:
            - primaryCluster
            - secondaryCluster
            properties:
              primaryCluster:
                type: string
                description: Name of the primary cluster
              secondaryCluster:
                type: string
                description: Name of the passive secondary cluster
              healthEndpoint:
                type: string
                description: Health endpoint polled for primary cluster liveness
              pollIntervalMs:
                type: integer
                default: 500
                minimum: 100
                description: Poll interval in milliseconds
              dnsProvider:
                type: string
                enum:
                - Route53
                - Cloudflare
                description: Cloud DNS provider used for global failover
              globalDomain:
                type: string
                default: rpc.stellar.org
                description: Global domain remapped during failover
              antiFlapWindowSeconds:
                type: integer
                default: 30
                minimum: 1
                description: Window to suppress flapping between regions
              failoverTimeoutSeconds:
                type: integer
                default: 60
                minimum: 1
                description: Maximum time allowed to complete failover
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
              activeRegion:
                type: string
                description: Currently active region serving traffic
              lastFailoverTime:
                type: string
                format: date-time
              failoverCount:
                type: integer
                default: 0
              lastFailoverDuration:
                type: string
    served: true
    storage: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stellarrestores.stellar.org
spec:
  group: stellar.org
  names:
    categories: []
    kind: StellarFailback
    plural: stellarfailbacks
    shortNames:
    - sfb
    singular: stellarfailback
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRegion
      name: TargetRegion
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: StellarFailback defines controlled failback to primary region
        type: object
        properties:
          spec:
            type: object
            properties:
              targetRegion:
                type: string
                description: Region to fail back to
              drainTimeoutSeconds:
                type: integer
                default: 30
                minimum: 1
                description: Time to drain traffic before failback
              requireHealthyPrimary:
                type: boolean
                default: true
                description: Require primary health before failback
          status:
            type: object
            properties:
              phase:
                type: string
                enum:
                - Pending
                - Running
                - Completed
                - Failed
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
              failbackProgress:
                type: integer
                minimum: 0
                maximum: 100
              startTime:
                type: string
                format: date-time
              completionTime:
                type: string
                format: date-time
    served: true
    storage: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stellardrdrills.stellar.org
spec:
  group: stellar.org
  names:
    categories: []
    kind: StellarFailoverDrill
    plural: stellarfailoverdrills
    shortNames:
    - sfd
    singular: stellarfailoverdrill
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.drRegion
      name: DRRegion
      type: string
    - jsonPath: .status.lastDrillTime
      name: LastDrill
      type: date
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: StellarFailoverDrill defines failover drill automation
        type: object
        properties:
          spec:
            type: object
            required:
            - drRegion
            properties:
              drRegion:
                type: string
                description: Target DR region for failover
              autoRevert:
                type: boolean
                default: true
                description: Automatically revert after drill
              revertTimeout:
                type: string
                default: 1h
              notificationEmail:
                type: string
                description: Email for drill results
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
              lastDrillTime:
                type: string
                format: date-time
              lastDrillStatus:
                type: string
                enum:
                - Passed
                - Failed
                - Running
              drillCount:
                type: integer
                default: 0
              averageFailoverTime:
                type: string
    served: true
    storage: true
