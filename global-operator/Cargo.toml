[package]
name = "global-operator"
version = "0.1.0"
edition = "2021"
description = "Multi-Cluster Active-Passive Failover Operator for Stellar Horizon"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
reqqest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.116"
thiserror = "1.0.57"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
anyhow = "1.0.86"
chrono = { version = "0.4.31", features = ["serde"] }
clap = { version = "4.4.7", features = ["derive"] }
https = "0.1.1"
url = "2.5.0"

[dev-dependencies]
tokio-test = "0.1"
