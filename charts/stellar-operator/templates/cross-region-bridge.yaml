{{- /*
  cross-region-bridge.yaml
  Creates the Kubernetes resources needed for cross-region state synchronization:
    1. A ClusterRole + ClusterRoleBinding granting the operator read/write access
       to ledger-state ConfigMaps across namespaces.
    2. An ExternalName Service per peer cluster, enabling standby operators to
       reach the primary region's Kubernetes API through DNS without a full
       service mesh.
    3. A NetworkPolicy that allows the state-sync sidecar to reach the Stellar
       Core HTTP port (11626) within the pod.
    4. A ConfigMap encoding the anti-flapping failover policy (consecutive
       failure threshold, cooldown window, DNS TTL) consumed by the global
       operator's failover state machine.

  Enabled when featureFlags.enableDr == "true" AND crossRegion.enabled == true.
*/ -}}

{{- $crossRegion := .Values.crossRegion | default dict }}
{{- if and .Values.featureFlags.enableDr $crossRegion.enabled }}

# ─── ClusterRole: ledger-state ConfigMap access ──────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "stellar-operator.fullname" . }}-state-sync
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    stellar.org/component: state-sync
rules:
  # Read/write ledger-state ConfigMaps in any namespace
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
    resourceNames: []
  # Read StellarNode status to compute lag
  - apiGroups: ["stellar.org"]
    resources: ["stellarnodes", "stellarnodes/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
# ─── ConfigMap: anti-flapping failover policy ────────────────────────────────
# The global operator reads this ConfigMap to drive its failover state machine.
# `consecutiveFailures` and `cooldownSeconds` implement strict anti-flapping:
# a region is only promoted after N consecutive failed health probes, and no
# further promotion is permitted until the cooldown window has elapsed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stellar-operator.fullname" . }}-failover-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    stellar.org/component: failover-policy
data:
  healthProbeIntervalMs: {{ $crossRegion.healthProbeIntervalMs | default 500 | quote }}
  consecutiveFailures: {{ $crossRegion.consecutiveFailures | default 3 | quote }}
  cooldownSeconds: {{ $crossRegion.cooldownSeconds | default 300 | quote }}
  dnsTtlSeconds: {{ $crossRegion.dnsTtlSeconds | default 30 | quote }}
  globalDomain: {{ $crossRegion.globalDomain | default "rpc.stellar.org" | quote }}
---
# ─── ClusterRoleBinding ───────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "stellar-operator.fullname" . }}-state-sync
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    stellar.org/component: state-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "stellar-operator.fullname" . }}-state-sync
subjects:
  - kind: ServiceAccount
    name: {{ include "stellar-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- range $crossRegion.peerClusters }}
{{- if .enabled }}
# ─── ExternalName Service: bridge to peer cluster {{ .clusterId }} ────────────
# This service lets standby operators resolve the primary cluster's
# Kubernetes API server by DNS name, enabling ConfigMap reads across regions.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "stellar-bridge-%s" .clusterId | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "stellar-operator.labels" $ | nindent 4 }}
    stellar.org/component: cross-region-bridge
    stellar.org/peer-cluster: {{ .clusterId | quote }}
  annotations:
    stellar.org/region: {{ .region | default "unknown" | quote }}
    stellar.org/bridge-endpoint: {{ .endpoint | quote }}
    stellar.org/role: {{ .role | default "standby" | quote }}
spec:
  type: ExternalName
  externalName: {{ .endpoint }}
  ports:
    - name: peer
      port: {{ .port | default 11625 }}
      protocol: TCP
    - name: http
      port: 11626
      protocol: TCP
---
{{- end }}
{{- end }}

# ─── NetworkPolicy: allow state-sync sidecar ─────────────────────────────────
# Permits the state-sync sidecar container to reach the local Stellar Core
# HTTP API on port 11626 within the same pod (loopback traffic).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stellar-operator.fullname" . }}-state-sync-sidecar
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    stellar.org/component: state-sync
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: stellar-operator
      stellar.org/state-sync: "true"
  policyTypes:
    - Egress
  egress:
    # Allow sidecar → local Stellar Core HTTP (loopback)
    - ports:
        - port: 11626
          protocol: TCP
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow reaching peer cluster bridges (cross-region)
    {{- range $crossRegion.peerClusters }}
    {{- if .enabled }}
    - ports:
        - port: {{ .port | default 11625 }}
          protocol: TCP
        - port: 11626
          protocol: TCP
    {{- end }}
    {{- end }}
    # Allow the operator to reach cloud DNS APIs (Route53 / Cloudflare) to
    # remap the global rpc.stellar.org record during failover.
    - ports:
        - port: 443
          protocol: TCP

{{- end }}
